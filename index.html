<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houses for Sale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Beautiful Houses for Sale</h1>
    </header>
    
    <main>
        <section class="houses">
            <div class="house">
                <h2>Modern Family Home</h2>
                <p>Beautiful 3-bedroom house with garden</p>
                <p class="price">$350,000</p>
            </div>
            
            <div class="house">
                <h2>Cozy Cottage</h2>
                <p>Charming 2-bedroom cottage in quiet neighborhood</p>
                <p class="price">$280,000</p>
            </div>
        </section>
    </main>
</body>
</html>
